<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daniel's Recipe Library</title></head><body><div id="loading" style="font-family:Arial,sans-serif;padding:2rem;text-align:center">Loading Daniel's Recipe Library…</div><script>
(async()=>{try{const files=["site.part00.txt","site.part01.txt","site.part02.txt","site.part03.txt","site.part04.txt","site.part05.txt","site.part06.txt","site.part07.txt"];const pieces=await Promise.all(files.map(f=>fetch(f).then(r=>{if(!r.ok)throw new Error(f+': '+r.status);return r.text()})));const b64=pieces.join('').trim();const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([bin]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close()}catch(e){document.getElementById('loading').innerHTML='<h1>Recipe Library</h1><p>Unable to load the cookbook.</p><pre>'+String(e)+'</pre>'}})();
</script></body></html>
